## NetFlow EMQX Access Control List
##
## Format: {allow | deny}  {User | all}  {publish | subscribe | all}  Topics
##
## Rules are evaluated top-to-bottom; first match wins.

## ── Backend service ──────────────────────────────────────────────────────────
## The NestJS backend authenticates with MQTT_USERNAME / MQTT_PASSWORD.
## It must publish commands and subscribe to all device telemetry.

{allow, {user, "netflow-backend"}, subscribe, "device/+/data"}.
{allow, {user, "netflow-backend"}, publish,   "device/+/command"}.
{allow, {user, "netflow-backend"}, publish,   "device/+/config"}.

## ── IoT devices ──────────────────────────────────────────────────────────────
## Each ESP32 authenticates with username = device_id, password = shared secret.
## Devices may only publish their own telemetry and subscribe to their own commands/config.

{allow, {user, "$username"}, publish,   ["device/$username/data"]}.
{allow, {user, "$username"}, subscribe, ["device/$username/command", "device/$username/config"]}.

## ── Dashboard (browser WebSocket) ────────────────────────────────────────────
## Browser clients connect over MQTT WebSocket (port 8083) to stream live data.
## Relaxation: Allow any client to subscribe to their unit's telemetry topic for dev.

{allow, all, subscribe, ["device/+/data"]}.

## ── Deny all else ────────────────────────────────────────────────────────────
{deny, all}.
