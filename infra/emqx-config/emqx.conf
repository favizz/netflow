## NetFlow EMQX 5 Configuration
## Mount this file as /opt/emqx/etc/emqx.conf inside the container.

node {
  name = "emqx@netflow-emqx"
  cookie = "netflow-secret-cookie"
}

## ── Listeners ─────────────────────────────────────────────────────────────────
listeners.tcp.default {
  bind = "0.0.0.0:1883"
  max_connections = 100000
}

listeners.ws.default {
  bind = "0.0.0.0:8083"
  max_connections = 50000
  websocket.path = "/mqtt"
}

listeners.ssl.default {
  bind = "0.0.0.0:8883"
  max_connections = 100000
  ssl_options {
    certfile   = "${EMQX_ETC_DIR}/certs/cert.pem"
    keyfile    = "${EMQX_ETC_DIR}/certs/key.pem"
    cacertfile = "${EMQX_ETC_DIR}/certs/cacert.pem"
    # Prefer TLS 1.3 for modern clients, but keep TLS 1.2 as a fallback for
    # ESP32 Arduino/mbedTLS builds that cannot negotiate TLS 1.3 reliably yet.
    versions   = ["tlsv1.3", "tlsv1.2"]
    # secp256r1 (P-256) is supported by all ESP32 Arduino SDK versions.
    # Do not leave eccs unset — EMQX defaults include X25519, which causes
    # MBEDTLS_ERR_PK_UNKNOWN_NAMED_CURVE (-15202) on affected firmware builds.
    eccs       = ["secp256r1"]
    ciphers    = []
  }
}

## ── Authentication - HTTP backend ─────────────────────────────────────────────
## Delegates credential checks to the NestJS backend.
## Endpoint: POST /auth/mqtt - body: { clientId, username, password }
## Response: 200 = allow, 4xx = deny.
##
## To enable: set EMQX_AUTH_ENABLED=true in .env and ensure
## MQTT_AUTH_ENDPOINT is reachable from the emqx container.

authentication = [
  {
    mechanism = password_based
    backend   = http
    enable    = ${EMQX_AUTH_ENABLED:-false}

    method    = post
    url       = "${MQTT_AUTH_ENDPOINT:-http://backend:5000}/auth/mqtt"
    headers { "content-type" = "application/json" }
    body {
      clientid = "${clientid}"
      username = "${username}"
      password = "${password}"
    }

    ## Response: body must contain {"result":"allow"} or {"result":"deny"}
    request_timeout   = 5s
    pool_size         = 32
  }
]

## ── Authorization (ACL) ───────────────────────────────────────────────────────
authorization {
  no_match = deny
  deny_action = disconnect

  sources = [
    {
      type   = file
      enable = true
      path   = "/opt/emqx/etc/acl.conf"
    }
  ]
}

## ── Session & connection tuning ───────────────────────────────────────────────
mqtt {
  max_packet_size      = 1MB
  max_clientid_len     = 64
  max_topic_levels     = 5
  retain_available     = false
  wildcard_subscription = true
  shared_subscription  = true
  session_expiry_interval = 2h
}

## ── Management API ────────────────────────────────────────────────────────────
## Bind the management dashboard to loopback only. Access it from an operator
## machine via SSH tunnel: ssh -L 18083:127.0.0.1:18083 user@host
## This prevents the broker control plane from being reachable on the public internet.
dashboard {
  listeners.http {
    bind = "127.0.0.1:18083"
  }
  default_username = "admin"
  default_password = "${EMQX_DASHBOARD_PASSWORD:-netflow_admin}"
}
