## NetFlow EMQX Access Control List
##
## Format: {allow | deny}  {User | all}  {publish | subscribe | all}  Topics
##
## Rules are evaluated top-to-bottom; first match wins.

## ── Backend service ──────────────────────────────────────────────────────────
## The NestJS backend authenticates with MQTT_USERNAME / MQTT_PASSWORD.
## Subscribes to telemetry + all ACKs; publishes commands, config, and OTA.

{allow, {user, "netflow-backend"}, subscribe, ["device/+/data", "device/+/command_ack", "device/+/config_ack", "device/+/ota_ack"]}.
{allow, {user, "netflow-backend"}, publish,   ["device/+/command", "device/+/config", "device/+/ota"]}.

## ── IoT devices ──────────────────────────────────────────────────────────────
## Each ESP32 authenticates with username = device_id, password = shared secret.
## Devices publish telemetry + ACKs; subscribe to their own command/config/ota topics.

{allow, {user, "$username"}, publish,   ["device/$username/data", "device/$username/command_ack", "device/$username/config_ack", "device/$username/ota_ack"]}.
{allow, {user, "$username"}, subscribe, ["device/$username/command", "device/$username/config", "device/$username/ota"]}.

## ── Dashboard (browser WebSocket) ────────────────────────────────────────────
## Browser clients connect over MQTT WebSocket (port 8083).
## Allow subscribing to live telemetry and all device ACK topics for the command log.

{allow, all, subscribe, ["device/+/data", "device/+/command_ack", "device/+/config_ack", "device/+/ota_ack"]}.

## ── Deny all else ────────────────────────────────────────────────────────────
{deny, all}.
