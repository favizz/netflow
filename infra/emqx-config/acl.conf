## NetFlow EMQX Access Control List
##
## Format: {allow | deny}  {User | all}  {publish | subscribe | all}  Topics
##
## Rules are evaluated top-to-bottom; first match wins.

## ── Backend service ──────────────────────────────────────────────────────────
## The NestJS backend authenticates with MQTT_USERNAME / MQTT_PASSWORD.
## Subscribes to telemetry + all ACKs; publishes commands, config, and OTA.

{allow, {user, "netflow-backend"}, subscribe, ["device/+/data", "device/+/command_ack", "device/+/config_ack", "device/+/ota_ack", "device/+/topup_ack", "device/+/admin_ack"]}.
{allow, {user, "netflow-backend"}, publish,   ["device/+/command", "device/+/config", "device/+/ota", "device/+/topup", "device/+/admin"]}.

## ── IoT devices ──────────────────────────────────────────────────────────────
## Each ESP32 authenticates with username = device_id, password = shared secret.
## Devices publish telemetry + ACKs; subscribe to their own command/config/ota topics.

{allow, {user, "$username"}, publish,   ["device/$username/data", "device/$username/command_ack", "device/$username/config_ack", "device/$username/ota_ack", "device/$username/topup_ack", "device/$username/admin_ack", "device/$username/status"]}.
{allow, {user, "$username"}, subscribe, ["device/$username/command", "device/$username/config", "device/$username/ota", "device/$username/topup", "device/$username/admin"]}.

## ── Dashboard (browser WebSocket) ────────────────────────────────────────────
## Browser clients authenticate with username="dashboard-browser" and
## password=MQTT_DASHBOARD_SECRET. Only subscribe is allowed — no publish.

{allow, {user, "dashboard-browser"}, subscribe, ["device/+/data", "device/+/command_ack", "device/+/config_ack", "device/+/ota_ack", "device/+/topup_ack", "device/+/admin_ack", "device/+/status"]}.

## ── Deny all else ────────────────────────────────────────────────────────────
{deny, all}.
