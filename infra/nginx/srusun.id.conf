location ^~ /assets/ {
    root      /home/srusun-ta252601002/TA-Flowmeter/frontend-ta/dashboard/dist;
    access_log off;
}

location = /mobile {
    return 301 /mobile/;
}

location = /mobile/ {
    root /home/srusun-ta252601002/TA-Flowmeter/frontend-ta/mobile/dist;
    rewrite .* /index.html break;
}

location ^~ /mobile/ {
    alias /home/srusun-ta252601002/TA-Flowmeter/frontend-ta/mobile/dist/;
    try_files $uri =404;
    access_log off;
}

location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|otf|eot|mp4|ogg|ogv|webm|gz|swf)$ {
    root /home/srusun-ta252601002/TA-Flowmeter/frontend-ta/dashboard/dist;
    expires max;
    access_log off;
}

location /api/ {
    proxy_pass         http://127.0.0.1:5000;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
}

location /mqtt {
    proxy_pass         http://127.0.0.1:8083/mqtt;
    proxy_http_version 1.1;
    proxy_set_header   Upgrade    $http_upgrade;
    proxy_set_header   Connection "Upgrade";
    proxy_set_header   Host       $host;
}

location / {
    root      /home/srusun-ta252601002/TA-Flowmeter/frontend-ta/dashboard/dist;
    try_files $uri $uri/ /index.html;
}
