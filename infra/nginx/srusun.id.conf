location ^~ /assets/ {
    root      /home/srusun-ta252601002/TA-Flowmeter/frontend-ta/mobile/dist;
    expires max;
    access_log off;
}

# Exact-match beats all regex/prefix blocks in outer Nginx configs.
# Without this, outer regex locations for image files intercept before location /.
location = /netflow-logo-white.png {
    root    /home/srusun-ta252601002/TA-Flowmeter/frontend-ta/mobile/dist;
    expires max;
    add_header Cache-Control "public, immutable";
}
location = /netflow-logo-black.png {
    root    /home/srusun-ta252601002/TA-Flowmeter/frontend-ta/mobile/dist;
    expires max;
    add_header Cache-Control "public, immutable";
}
location = /netflow-logo-icon.png {
    root    /home/srusun-ta252601002/TA-Flowmeter/frontend-ta/mobile/dist;
    expires max;
    add_header Cache-Control "public, immutable";
}

location = /admin {
    return 301 /admin/;
}

location ^~ /admin/ {
    alias /home/srusun-ta252601002/TA-Flowmeter/frontend-ta/dashboard/dist/;
    index index.html;
    try_files $uri $uri/ /admin/index.html;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
}

location /api/ {
    proxy_pass         http://127.0.0.1:5000;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
}

location /mqtt {
    proxy_pass         http://broker.emqx.io:8083/mqtt;
    proxy_http_version 1.1;
    proxy_set_header   Upgrade    $http_upgrade;
    proxy_set_header   Connection "Upgrade";
    proxy_set_header   Host       $host;
}

location / {
    root      /home/srusun-ta252601002/TA-Flowmeter/frontend-ta/mobile/dist;
    try_files $uri $uri/ /index.html;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
}
