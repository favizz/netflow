# /etc/nginx/sites-available/srusun.id
# Symlink: ln -s /etc/nginx/sites-available/srusun.id /etc/nginx/sites-enabled/
#
# Services this config routes to:
#   Backend API  →  pm2 on 127.0.0.1:5000
#   Dashboard    →  static files at ~/TA-Flowmeter/frontend-ta/dashboard/dist/
#   Mobile       →  static files at ~/TA-Flowmeter/frontend-ta/mobile/dist/
#   MQTT WS      →  EMQX on 127.0.0.1:8083/mqtt
#
# After placing this file:
#   sudo certbot --nginx -d srusun.id -d www.srusun.id -d app.srusun.id
#   sudo nginx -t && sudo systemctl reload nginx

# ── HTTP → HTTPS redirect ────────────────────────────────────────────────────
server {
    listen 80;
    server_name srusun.id www.srusun.id app.srusun.id;
    return 301 https://$host$request_uri;
}

# ── Dashboard — srusun.id ────────────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name srusun.id www.srusun.id;

    ssl_certificate     /etc/letsencrypt/live/srusun.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/srusun.id/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    root /home/ubuntu/TA-Flowmeter/frontend-ta/dashboard/dist;
    index index.html;

    # API proxy — /api/* → NestJS backend
    location /api/ {
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # MQTT WebSocket proxy — wss://srusun.id/mqtt → EMQX :8083/mqtt
    location /mqtt {
        proxy_pass         http://127.0.0.1:8083/mqtt;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_read_timeout 3600s;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache hashed static assets forever
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;
}

# ── Mobile — app.srusun.id ───────────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name app.srusun.id;

    ssl_certificate     /etc/letsencrypt/live/srusun.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/srusun.id/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    root /home/ubuntu/TA-Flowmeter/frontend-ta/mobile/dist;
    index index.html;

    location /api/ {
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /mqtt {
        proxy_pass         http://127.0.0.1:8083/mqtt;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_read_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;
}
