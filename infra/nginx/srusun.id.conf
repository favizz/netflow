pagespeed RewriteLevel CoreFilters;
pagespeed EnableFilters remove_quotes;
pagespeed DisableFilters prioritize_critical_css;
pagespeed EnableFilters recompress_images;
pagespeed EnableFilters responsive_images,resize_images;
pagespeed EnableFilters lazyload_images;
pagespeed EnableFilters sprite_images;
pagespeed EnableFilters insert_dns_prefetch;
pagespeed EnableFilters collapse_whitespace;
pagespeed EnableFilters dedup_inlined_images;
pagespeed EnableFilters inline_preview_images,resize_mobile_images;
pagespeed HttpCacheCompressionLevel 0;
pagespeed FetchHttps enable;
location ~ "^/pagespeed_static/" { }
location ~ "^/ngx_pagespeed_beacon$" { }
location ~ "\.pagespeed\.([a-z]\.)?[a-z]{2}\.[^.]{10}\.[^.]+" {
add_header "" "";
}

location ^~ /assets/ {
    root      /home/srusun-ta252601002/TA-Flowmeter/frontend-ta/mobile/dist;
    expires max;
    access_log off;
}

location = /netflow-logo-white.png {
    root    /home/srusun-ta252601002/TA-Flowmeter/frontend-ta/mobile/dist;
    expires max;
    add_header Cache-Control "public, immutable";
}

location = /netflow-logo-black.png {
    root    /home/srusun-ta252601002/TA-Flowmeter/frontend-ta/mobile/dist;
    expires max;
    add_header Cache-Control "public, immutable";
}

location = /netflow-logo-icon.png {
    root    /home/srusun-ta252601002/TA-Flowmeter/frontend-ta/mobile/dist;
    expires max;
    add_header Cache-Control "public, immutable";
}

location = /admin {
    return 301 /admin/;
}

location ^~ /admin/ {
    alias /home/srusun-ta252601002/TA-Flowmeter/frontend-ta/dashboard/dist/;
    index index.html;
    try_files $uri $uri/ /admin/index.html;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
}

location ^~ /api/ {
    proxy_pass         http://127.0.0.1:5000;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
}

location ^~ /mqtt {
    proxy_pass         http://127.0.0.1:8083/mqtt;
    proxy_http_version 1.1;
    proxy_set_header   Upgrade    $http_upgrade;
    proxy_set_header   Connection "Upgrade";
    proxy_set_header   Host       $host;
}

location ^~ /emqx/ {
    proxy_pass         http://127.0.0.1:18083/;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
}

location / {
    root      /home/srusun-ta252601002/TA-Flowmeter/frontend-ta/mobile/dist;
    try_files $uri $uri/ /index.html;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
}