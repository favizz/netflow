version: 2
updates:
  - package-ecosystem: npm
    directory: /backend-ta
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      backend-deps:
        patterns: ["*"]
    ignore:
      # eslint, @eslint/js, and typescript-eslint must be upgraded together
      # across major versions — block individual major bumps to prevent peer dep conflicts
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript-eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@typescript-eslint/*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /frontend-ta/dashboard
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dashboard-deps:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /frontend-ta/mobile
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      mobile-deps:
        patterns: ["*"]
    ignore:
      - dependency-name: "recharts"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-day-picker"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-resizable-panels"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
