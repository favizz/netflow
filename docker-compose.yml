version: '3.8'

services:
  # 1. Database (Postgres + TimescaleDB)
  timescaledb:
    image: timescale/timescaledb:latest-pg14
    container_name: ta_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - timescale_data:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d
    ports:
      # Bound explicitly to localhost so CloudPanel firewall is respected
      - "127.0.0.1:5433:5432"
    networks:
      - iot_net

  # 2. MQTT Broker (EMQX)
  emqx:
    image: emqx/emqx:5.0.26
    container_name: ta_broker
    restart: always
    ports:
      # These must be public for devices, unless devices connect via Nginx TCP stream
      - "1883:1883"
      # Websocket exposed to localhost, Caddy/Nginx should reverse proxy wss:// to this
      - "127.0.0.1:8083:8083"
      - "127.0.0.1:18083:18083"
    networks:
      - iot_net

  # 3. Backend (NestJS)
  backend:
    build: ./backend-ta
    container_name: ta_backend
    restart: always
    depends_on:
      - timescaledb
    environment:
      DB_HOST: timescaledb
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASS}
      DB_NAME: ${DB_NAME}
    ports:
      - "127.0.0.1:5000:5000"
    networks:
      - iot_net

  # 4. Dashboard (Next.js)
  dashboard:
    build: ./frontend-ta/dashboard
    container_name: ta_dashboard
    restart: always
    ports:
      # Nginx proxy_pass should point to this port
      - "127.0.0.1:3000:3000"
    networks:
      - iot_net

  # 5. Mobile Web (Nginx Static)
  mobile:
    build: ./frontend-ta/mobile
    container_name: ta_mobile
    restart: always
    ports:
      # Nginx proxy_pass can point here if subdomain is used
      - "127.0.0.1:8080:80"
    networks:
      - iot_net

volumes:
  timescale_data:

networks:
  iot_net:
    driver: bridge