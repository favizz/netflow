version: '3.8'

services:
  # 1. Database (MySQL 8.0) — mirrors the VPS MySQL already running on the server
  mysql:
    image: mysql:8.0
    container_name: ta_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ta_db
      MYSQL_USER: ta_user
      MYSQL_PASSWORD: ta_pass
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db-init:/docker-entrypoint-initdb.d
    ports:
      - "127.0.0.1:3306:3306"
    networks:
      - iot_net

  # 2. Database visualizer
  adminer:
    image: adminer
    container_name: ta_adminer
    restart: always
    ports:
      - "127.0.0.1:8081:8080"
    networks:
      - iot_net

  # 3. MQTT Broker (EMQX)
  emqx:
    image: emqx/emqx:5.8
    container_name: ta_broker
    restart: always
    ports:
      # These must be public for devices, unless devices connect via Nginx TCP stream
      - "1883:1883"
      # Websocket exposed to localhost, Caddy/Nginx should reverse proxy wss:// to this
      - "127.0.0.1:8083:8083"
      - "127.0.0.1:18083:18083"
    networks:
      - iot_net

  # 3. Backend (NestJS)
  backend:
    build: ./backend-ta
    container_name: ta_backend
    restart: always
    depends_on:
      - mysql
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASS}
      DB_NAME: ${DB_NAME}
    ports:
      - "127.0.0.1:5000:5000"
    networks:
      - iot_net

  # 4. Dashboard (React+Vite)
  dashboard:
    build: ./frontend-ta/dashboard
    container_name: ta_dashboard
    restart: always
    ports:
      # Nginx proxy_pass should point to this port
      - "127.0.0.1:3000:3000"
    networks:
      - iot_net

  # 5. Mobile Web (Nginx Static)
  mobile:
    build: ./frontend-ta/mobile
    container_name: ta_mobile
    restart: always
    ports:
      # Nginx proxy_pass can point here if subdomain is used
      - "127.0.0.1:8080:80"
    networks:
      - iot_net

volumes:
  mysql_data:

networks:
  iot_net:
    driver: bridge