; PlatformIO Project Configuration
; Target: Denky32 (ESP32-D0WDQ6-V3)
; Requires ESP32 Arduino core v3.x (espressif32 >= 6.x) for ledcAttach API.

[env:denky32]
platform  = espressif32
board     = denky32
framework = arduino

lib_deps =
    marcoschwartz/LiquidCrystal_I2C@^1.1.4
    mandulaj/PZEM-004T-v30@^1.1.2
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.2.0

; WiFiClientSecure, HTTPUpdate, and driver/pcnt are bundled with the ESP32 core.
